[project]
name = "gridbricks"
dynamic = ["version"]
description = "Day-ahead wind forecast monitoring API for GB power procurement"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "httpx2>=2.16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gridbricks/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gridbricks"]

# --- Lint & format -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # modern syntax
    "B",            # bugbear
    "SIM",          # simplifications
    "C4",           # comprehensions
    "DTZ",          # no naive datetimes: every timestamp must carry a timezone
    "PT",           # pytest style
    "RET", "PIE",
    "N",            # naming
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters (–, ×) in strings/docs

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

# --- Types -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["gridbricks"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "snapshot: runs against the committed January 2026 data snapshot",
]
filterwarnings = ["error::FutureWarning", "error::DeprecationWarning:gridbricks.*"]

[tool.coverage.run]
source = ["gridbricks"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
